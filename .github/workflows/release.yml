name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Resuelve las dependencias antes de compilar.
  #
  #   * En un push a master: no toca nada, solo valida que uv.lock cuadra con
  #     pyproject.toml y lo pasa a los jobs de build como artefacto.
  #   * En un release (tag v*): re-resuelve TODO a lo ultimo que permitan los
  #     ">=" de pyproject.toml, corre los tests como puerta (si fallan, el
  #     release se aborta y no se publica nada roto), regenera requirements.txt
  #     desde el lock, y commitea uv.lock + requirements.txt de vuelta a master
  #     con "[skip ci]" para que ese commit no dispare otro build.
  #
  # Los dos jobs de build consumen el mismo uv.lock por artefacto, asi que
  # portable y MSI se compilan siempre contra exactamente las mismas versiones.
  # ---------------------------------------------------------------------------
  lock:
    name: Resolve dependencies
    runs-on: windows-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Upgrade lock to latest (release only)
        if: github.ref_type == 'tag'
        run: uv lock --upgrade

      # En push a master: no re-resuelve nada, solo reconcilia el lock con
      # pyproject.toml (p. ej. cuando solo cambio el campo `version`) para que
      # el build de comprobacion no salga rojo por un desajuste inofensivo.
      # Este lock NO se commitea; solo vale para esta corrida.
      - name: Reconcile lock with pyproject (non-release)
        if: github.ref_type != 'tag'
        run: uv lock

      - name: Install dependencies
        run: uv sync --locked --no-install-project

      - name: Run tests (release gate)
        if: github.ref_type == 'tag'
        run: uv run poe test

      - name: Regenerate requirements.txt (release only)
        if: github.ref_type == 'tag'
        run: uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o requirements.txt

      - name: Commit refreshed lock to master (release only)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git config core.autocrlf input
          if git diff --quiet -- uv.lock requirements.txt; then
            echo "uv.lock y requirements.txt sin cambios; nada que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.txt
          git commit -m "chore: lock deps for ${{ github.ref_name }} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Upload lock
        uses: actions/upload-artifact@v4
        with:
          name: uvlock
          path: uv.lock
          retention-days: 1

  build-portable:
    name: Build Portable Version
    needs: [lock]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Use refreshed lock
        uses: actions/download-artifact@v4
        with:
          name: uvlock

      - name: Create data.json
        run: echo "{}" > data.json

      - name: Sync VERSION file
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            # Extract version from tag (remove 'v' prefix)
            $version = "${{ github.ref_name }}".TrimStart('v')
            Write-Host "Using version from tag: $version"
          } else {
            # Read version from pyproject.toml
            $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"' | ForEach-Object { $_.Matches.Groups[1].Value })
            Write-Host "Using version from pyproject.toml: $version"
          }
          # Write without BOM using UTF8 encoding without BOM
          [System.IO.File]::WriteAllText("VERSION", $version, [System.Text.UTF8Encoding]::new($false))
          Write-Host "VERSION file updated to: $version"
        shell: pwsh

      - name: Install dependencies
        run: uv sync --locked --no-install-project

      - name: Build portable version
        run: uv run cxfreeze build

      # Las instalaciones compiladas con cx_Freeze hasta la 3.97-rc1 copian la
      # actualizacion con el bootstrap.exe que ya tienen, y ese bootstrap
      # mantiene abiertos estos 4 .pyd de su propio lib\: si el zip trae los
      # mismos nombres, la copia se corta a mitad (VERSION ya escrito, VeTube
      # sin relanzar). Con el nombre completo (p. ej. _bz2.cp314-win_amd64.pyd)
      # son archivos nuevos para ellas, y Python los carga igual: es el primer
      # sufijo que busca. Solo el zip: el actualizador integrado no descarga el MSI.
      #
      # NO QUITAR mientras se compile con Python 3.14: el actualizador no borra
      # nada, y donde ya hay un nombre largo, ese gana sobre cualquier .pyd corto
      # nuevo (modulos viejos para siempre). El paso exige el sufijo de la 3.14:
      # con 3.15, esas instalaciones conservarian su python3.dll de la 3.14 y
      # VeTube ya no arrancaria. Antes de pasar a 3.15 hace falta una release en
      # 3.14 con la #149; despues este paso se quita (los .cp314 quedan inertes).
      - name: Rename locked .pyd (portable zip only)
        run: |
          $buildPath = Get-ChildItem -Path "build" -Directory | Select-Object -First 1
          $suffix = uv run python -c "import importlib.machinery as m; print(m.EXTENSION_SUFFIXES[0])"
          if ("$suffix" -ne '.cp314-win_amd64.pyd') {
            throw "Extension suffix is '$suffix', not .cp314-win_amd64.pyd: read the comment above this step before changing Python"
          }
          $renamed = 0
          foreach ($name in "_bz2", "_ctypes", "_lzma", "_zstd") {
            $pyd = Join-Path $buildPath.FullName "lib\$name.pyd"
            if (Test-Path $pyd) {
              Rename-Item -Path $pyd -NewName "$name$suffix"
              Write-Host "Renamed lib\$name.pyd -> lib\$name$suffix"
              $renamed++
            } else {
              Write-Host "::warning::lib\$name.pyd not found, nothing to rename"
            }
          }
          if ($renamed -eq 0) {
            throw "None of the 4 .pyd found in $($buildPath.FullName)\lib: this zip would break the update of installations up to 3.97-rc1"
          }
        shell: pwsh

      # Comprobacion: el bootstrap.exe congelado importa ctypes al arrancar. Sin
      # argumentos tiene que cargar el _ctypes renombrado, escribir "No hay
      # suficientes argumentos" en su log y salir con 1; si no, ni el bootstrap
      # ni VeTube arrancarian con este zip. Con base "gui", un error de
      # importacion abre una ventana modal: de ahi el limite de 30 s.
      - name: Check that the frozen bootstrap loads the renamed .pyd
        run: |
          $buildPath = Get-ChildItem -Path "build" -Directory | Select-Object -First 1
          $exe = Join-Path $buildPath.FullName "bootstrap.exe"
          $tmp = Join-Path ([IO.Path]::GetTempPath()) ("bootstrap-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $log = Join-Path $tmp "vetube_bootstrap_debug.txt"
          $psi = New-Object Diagnostics.ProcessStartInfo $exe
          $psi.UseShellExecute = $false
          $psi.EnvironmentVariables["TEMP"] = $tmp
          $p = [Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(30000)) {
            $p.Kill()
            throw "bootstrap.exe did not exit within 30 s (error dialog of the gui base?)"
          }
          $logged = (Test-Path $log) -and (Select-String -Path $log -SimpleMatch "No hay suficientes argumentos" -Quiet)
          if ($p.ExitCode -ne 1 -or -not $logged) {
            throw "Frozen bootstrap.exe failed with the renamed .pyd (exit code $($p.ExitCode), log line found: $logged)"
          }
          Write-Host "Frozen bootstrap.exe imported ctypes with the renamed .pyd"
        shell: pwsh

      - name: Compress build (zip)
        run: |
          $version = "${{ github.ref_name }}"
          $buildPath = Get-ChildItem -Path "build" -Directory | Select-Object -First 1
          Compress-Archive -Path "$($buildPath.FullName)\*" -DestinationPath "vetube-$version.zip" -CompressionLevel Optimal
        shell: pwsh

      - name: Generate SHA256 checksum
        run: |
          $version = "${{ github.ref_name }}"
          $hash = (Get-FileHash "vetube-$version.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  vetube-$version.zip" | Out-File -FilePath "vetube-$version.zip.sha256" -Encoding UTF8
        shell: pwsh

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-build
          path: |
            vetube-*.zip
            vetube-*.sha256
          retention-days: 1

  build-msi:
    name: Build MSI Installer
    needs: [lock]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Use refreshed lock
        uses: actions/download-artifact@v4
        with:
          name: uvlock

      - name: Create data.json
        run: echo "{}" > data.json

      - name: Sync VERSION file
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            # Extract version from tag (remove 'v' prefix)
            $version = "${{ github.ref_name }}".TrimStart('v')
            Write-Host "Using version from tag: $version"
          } else {
            # Read version from pyproject.toml
            $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"' | ForEach-Object { $_.Matches.Groups[1].Value })
            Write-Host "Using version from pyproject.toml: $version"
          }
          # Write without BOM using UTF8 encoding without BOM
          [System.IO.File]::WriteAllText("VERSION", $version, [System.Text.UTF8Encoding]::new($false))
          Write-Host "VERSION file updated to: $version"
        shell: pwsh

      - name: Install dependencies
        run: uv sync --locked --no-install-project

      - name: Build MSI installer
        run: uv run cxfreeze bdist_msi
        shell: pwsh

      - name: Rename MSI
        run: |
          $version = "${{ github.ref_name }}"
          $msiFile = Get-ChildItem -Path "dist" -Filter "*.msi" | Select-Object -First 1
          Rename-Item -Path $msiFile.FullName -NewName "vetube-$version.msi"
        shell: pwsh

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-build
          path: dist/vetube-*.msi
          retention-days: 1

  release:
    name: Create Release
    needs: [build-portable, build-msi]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: portable-build
          path: dist/

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: msi-build
          path: dist/

      - name: List release assets
        run: ls -la dist/
        shell: bash

      - name: Detect prerelease
        id: detect
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ -beta|-rc|-alpha ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG detected as prerelease"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG detected as stable release"
          fi
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vetube-*.zip
            dist/vetube-*.zip.sha256
            dist/vetube-*.msi
          draft: false
          prerelease: ${{ steps.detect.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-docs:
    name: Update README download links
    needs: [release]
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update download links in all languages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Updating README links to version $VERSION"
          find doc -name "readme.md" -exec sed -i "s/vetube-v[0-9][0-9.]*\.\(zip\|msi\)/vetube-v${VERSION}.\1/g" {} +
          echo "Updated files:"
          grep -r "vetube-v" doc/ --include="readme.md"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: update download links to ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:master
