[project]
name = "vetube"
version = "3.95"
description = "Aplicación VeTube"
readme = "README.md"
requires-python = ">=3.14"

authors = [
    { name = "Cesar Verastegui", email = "37036927+metalalchemist@users.noreply.github.com" },
]
maintainers = [
    { name = "Cesar Verastegui", email = "37036927+metalalchemist@users.noreply.github.com" },
    { name = "Rowell Urbaez Reyes", email = "167712855+Row0902@users.noreply.github.com" },
]

dependencies = [
    "audioop-lts>=0.2.2",
    "chat-downloader",
    "cx-freeze>=8.6.4",
    "discord-py>=2.7.1",
    "edge-tts>=7.0.0",
    "googletrans-py",
    "grpclib>=0.4.9",
    "httpx>=0.28.1",
    "kick-py",
    "packaging>=26.3",
    "prismatoid>=0.17.3",
    "protobuf>=7.35.1",
    "psutil>=7.2.2",
    "pyperclip>=1.11.0",
    "pytchat",
    "python-vlc>=3.0.21203",
    "pywin32>=312",
    "sound-lib",
    "tiktoklive>=6.6.6",
    "uiautomation>=2.0.29",
    "wxpython>=4.3.1",
    "yt-dlp[curl-cffi,default]>=2026.7.4",
]

[dependency-groups]
dev = [
    "cx-freeze>=8.6.4",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
kick-py = { git = "https://github.com/iamoverit/kick.py" }
chat-downloader = { git = "https://github.com/owsombra/chat-downloader" }
sound-lib = { git = "https://github.com/accessibleapps/sound_lib" }
googletrans-py = { git = "https://github.com/rmcpantoja/googletrans.git" }
pytchat = { git = "https://github.com/KaitoCross/pytchat" }

[tool.poe.tasks]
build = "cxfreeze build"
dev = "run_main_window.py"
format = "ruff format src ui utils update TTS translates controller servicios"
lint = "ruff check --fix src ui utils update TTS translates controller servicios"
msi = "cxfreeze bdist_msi"
test = "pytest -v --maxfail=1 --disable-warnings tests/"
check = ["format", "lint", "test"]

# Documentación: https://cx-freeze.readthedocs.io/
# Skill: cxfreeze-config (referencias completas en assets/ y references/)

[tool.cxfreeze]
[[tool.cxfreeze.executables]]
script = "run_main_window.py"
base = "gui"
target_name = "VeTube.exe"
shortcut_name = "VeTube"
shortcut_dir = "ProgramMenuFolder"
copyright = "Copyright (C) 2026 VeTube Team"

[[tool.cxfreeze.executables]]
script = "update/bootstrap_fix.py"
base = "gui"
target_name = "bootstrap.exe"

[tool.cxfreeze.build_exe]
optimize = 2
packages = [
    "wx",
    "asyncio",
    "yt_dlp",
    "vlc",
    "win32com",
    "uiautomation",
    "comtypes",
    "comtypes.stream",
    "sound_lib",
    "sound_lib.external",
    "googletrans",
    "pytchat",
    "chat_downloader",
    "discord",
    "edge_tts",
    "TikTokLive",
    "TikTokLiveProto",
    "TikTokLiveProto.v3",
    "TikTokLiveProto.v3.webcast",
    "TikTokLiveProto.v3.webcast.model",
    "TikTokLiveProto.v3.webcast.model.data",
    "TikTokLiveProto.v3.webcast.model.data.multi_guest_play",
    "TikTokLiveProto.v3.webcast.model.data.oec_msg",
    "TikTokLiveProto.v3.webcast.model.message",
    "TikTokLiveProto.v3.webcast.model.base",
    "TikTokLiveProto.v3.webcast.model.base.user",
    "TikTokLiveProto.v3.webcast.message",
    "TikTokLiveProto.v3.webcast.message.proto",
    "httpx",
    "psutil",
    "pyperclip",
    "audioop",
    "src",
    "ui",
    "utils",
    "update",
    "TTS",
    "controller",
    "servicios",
]

includes = ["edge_tts"]

excludes = [
    "tkinter",
    "unittest",
    "test",
    "IPython",
    "matplotlib",
    "TTS.sonata_protos.sonata_grpc_pb2_grpc",
    "czipfile",                               # Fallback a zipfile stdlib
]

zip_include_packages = [
    "encodings",
    "httpx",
    "httpcore",
    "anyio",
    "sniffio",
    "certifi",
    "idna",
]

zip_exclude_packages = ["*"]

bin_includes = []

bin_excludes = ["api-ms-win-*.dll"]

include_msvcr = false
include_files = [
    ["data.json", "data.json"],
    ["VERSION", "VERSION"],

    ["locales/", "locales/"],
    ["sounds/", "sounds/"],

    # La carpeta 64/ se copia entera (bypass64.exe + libvlc + plugins de VLC).
    # Los motores de voz (64/sonata, 64/sherpa) NO están en el repo: se
    # descargan a demanda a engines/ desde la release «motores», así que
    # nunca aparecen aquí dentro. Si alguna vez los extraes en 64/ para
    # probar, bórralos antes de compilar o viajarán en el build.
    ["64/", "lib/64/"],

    [".venv/Lib/site-packages/sound_lib/lib/", "sound_lib/lib/"],
]

[tool.cxfreeze.bdist_msi]
upgrade_code = "{A41D2ECB-3DAE-4275-A644-038DD79BF765}"
add_to_path = false
initial_target_dir = '[ProgramFilesFolder]\\VeTube'
